version: "3.8"

services:
  assetoracle:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    container_name: assetoracle-postgres
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./assetoracle-frontend
    ports:
      - "3000:80"    # Exposes the frontend on port 3000 (mapped to container's port 80)
    restart: always

volumes:
  pgdata:
