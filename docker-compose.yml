version: "3.8"

services:
  assetoracle:
    build: .
    ports:
      - "8080:8080"
    env_file: ./src/.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    container_name: assetoracle_db
    restart: always
    env_file: ./src/.env
    ports:
      - "5432:5432"
    volumes:
      - ./data/db/data:/var/lib/postgresql/data

volumes:
  pgdata:
