version: "3.8"

services:
  assetoracle:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: "postgres://assets_dev:Ass3tSsS_dev@localhost:5432/assetoracle_db"
    depends_on:
      - postgres
    command: ["/bin/bash"]


  postgres:
    image: postgres:14
    container_name: assetoracle-postgres
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    build: ./assetoracle-frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  pgdata:
