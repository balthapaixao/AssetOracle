  postgres:
    image: postgres:14
    container_name: assetoracle-postgres
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./data/db/data:/var/lib/postgresql/data
  frontend:
    build: ./assetoracle-frontend
    ports:
      - "3000:80"
    restart: always

volumes:
  pgdata:
